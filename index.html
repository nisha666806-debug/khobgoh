<!doctype html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dormitory Management System</title>
<link rel="icon" type="image/png" href="assets/dormitory-logo.png">

<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dormitory">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo brand-icon"><img src="assets/dormitory-logo.png" alt="Dormitory Management System logo"></div><div><b>Dormitory</b><small>Management System</small></div></div>
    <nav id="nav">
      <button data-page="dashboard">📊 Dashboard</button>
      <button data-page="students">👨‍🎓 Донишҷӯён</button>

      <button data-page="violations">⚠️ Қоидавайронкунӣ</button>

    <div class="sidebar-bottom"><span id="roleBadge">Manager</span><button id="logout">Баромадан</button></div>

  <main class="main">
    <header><button id="menu">☰</button><div><h1 id="title">Dashboard</h1><p id="subtitle">Идоракунии хобгоҳ</p></div><div class="user">👤 <span id="userName">Manager</span></div></header>
    <section id="content"></section>
  </main>

<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>
<script type="module" src="js/app.js"></script>
