<!doctype html>
<html lang="tg" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Хобгоҳ — Идоракунии хобгоҳ</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/dormitory-logo.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Хобгоҳ">
  <meta name="application-name" content="Хобгоҳ">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Main Application Mounting Container -->
  <div id="app-root"></div>

  <!-- Reusable Global Modal Dialog (Clicking backdrop closes modal - Requirement 5) -->
  <div id="modal-backdrop" class="modal-backdrop" style="display:none;" onclick="if(event.target === this) window.khobgoh.closeModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title" style="margin:0; font-size:17px; font-weight:700;">Сарлавҳа</h3>
        <button class="btn btn-outline btn-sm" onclick="window.khobgoh.closeModal()" style="border-radius:50%; width:30px; height:30px; padding:0; display:flex; align-items:center; justify-content:center;">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Global Toast Notification Layer -->
  <div id="toast-container"></div>

  <!-- Core App ES Module -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker registration for PWA & Offline reliability -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Khobgoh PWA ServiceWorker active:', reg.scope))
          .catch(err => console.debug('ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
