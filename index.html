<!doctype html>
<html lang="tg" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Хобгоҳ — Идоракунии хобгоҳ</title>
  
  <!-- Web App Icons (Android & Desktop) -->
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  
  <!-- Apple Touch Icons (iPhone & iPad) -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png">
  
  <!-- PWA Manifest & App Config -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Хобгоҳ">
  <meta name="application-name" content="Хобгоҳ">

  <link rel="stylesheet" href="css/main.css?v=2.7">

  <script>
    // Fail-safe error boundary for blank screen prevention
    window.addEventListener('error', function(e) {
      console.error('Captured window error:', e);
      const root = document.getElementById('app-root');
      if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
        root.innerHTML = `
          <div style="padding:28px 20px; font-family:system-ui, -apple-system, sans-serif; text-align:center; max-width:440px; margin:50px auto; background:#ffffff; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.08); border:1px solid #e5e7eb;">
            <div style="font-size:44px; margin-bottom:12px;">📱</div>
            <h2 style="color:#111827; margin:0 0 8px 0; font-size:20px; font-weight:800;">Навсозии Барнома</h2>
            <p style="color:#6b7280; font-size:14px; line-height:1.5; margin:0 0 20px 0;">
              Барои фаъол шудани нусхаи нави хобгоҳ ва тоза кардани кэши кӯҳна, тугмаи зерро пахш намоед:
            </p>
            <button onclick="window.khobgohForceReload()" style="background:#059669; color:#fff; border:none; padding:12px 24px; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 4px 12px rgba(5,150,105,0.3); width:100%;">
              🔄 Тоза кардан ва кушодани барнома
            </button>
          </div>
        `;
      }
    });

    window.khobgohForceReload = function() {
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(r => r.unregister());
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        });
      } else {
        window.location.reload(true);
      }
    };
  </script>
</head>
<body>
  <!-- Main Application Mounting Container -->
  <div id="app-root"></div>

  <!-- Reusable Global Modal Dialog (Clicking backdrop closes modal) -->
  <div id="modal-backdrop" class="modal-backdrop" style="display:none;" onclick="if(event.target === this) window.khobgoh.closeModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title" style="margin:0; font-size:17px; font-weight:700;">Сарлавҳа</h3>
        <button class="btn btn-outline btn-sm" onclick="window.khobgoh.closeModal()" style="border-radius:50%; width:30px; height:30px; padding:0; display:flex; align-items:center; justify-content:center;">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Global Toast Notification Layer -->
  <div id="toast-container"></div>

  <!-- Core App ES Module -->
  <script type="module" src="js/app.js?v=2.7"></script>

  <!-- Service Worker registration for PWA & Offline reliability -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=2.7')
          .then(reg => {
            reg.update();
            console.log('Khobgoh PWA ServiceWorker active:', reg.scope);
          })
          .catch(err => console.debug('ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
